[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false

# Test configuration
test = "test"
cache_path = "cache_forge"

# RPC endpoints for testing and deployment
[rpc_endpoints]
sepolia = "https://eth-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}"

# Etherscan configuration for contract verification
[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
# Test profile with verbose output
[profile.test]
verbosity = 2
show_progress = true

# Deployment profile
[profile.deploy]
verbosity = 1

# Local development profile
[profile.local]
verbosity = 3
show_progress = true
ffi = false

# Gas reporting
gas_reports = ["*"]

# Coverage configuration
[coverage]
exclude = ["test/**/*", "script/**/*"]
